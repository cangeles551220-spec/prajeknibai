<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152438">
  <title>TechServe | Repair operations workspace</title>
  <link rel="icon" type="image/png" href="images/techserve-logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-visual">
        <img class="brand-logo brand-logo-login" src="images/techserve-logo.png" alt="TechServe logo" />
      </div>

      <div class="login-panel">
        <div class="login-heading">
          <div class="login-symbol">+</div>
          <h1>Login to your Account</h1>
          <p>See what is going on with your business</p>
        </div>

        <form id="loginForm">
          <label for="loginUser">Username</label>
          <input id="loginUser" type="text" placeholder="Enter username" autocomplete="username" required>

          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" placeholder="Enter password" autocomplete="current-password" required>

          <div id="loginError" class="login-error hidden">Invalid username or password.</div>
          <button type="submit" class="button button-primary login-button">Login</button>
        </form>

      </div>
    </div>
  </div>

  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="brand-logo brand-logo-sidebar" src="images/techserve-logo.png" alt="TechServe logo" />
      </div>
      <div class="workspace-switcher">
        <span class="avatar avatar-blue" id="workspaceInitials">SA</span>
        <div>
          <b id="workspaceName">TechServe HQ</b>
          <small id="workspaceRole">ADMIN</small>
        </div>
      </div>
      <nav class="nav">
        <p class="nav-label">Workspace</p>
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-item" data-view="repairs"><span class="nav-icon">▣</span>Repair jobs <b class="nav-count">8</b></button>
        <button class="nav-item" data-view="tracking"><span class="nav-icon">◉</span>Repair tracking</button>
        <button class="nav-item" data-view="customers"><span class="nav-icon">♙</span>Customers</button>
        <button class="nav-item" data-view="devices"><span class="nav-icon">▤</span>Devices</button>
        <button class="nav-item" data-view="technicians"><span class="nav-icon">♙</span>Technicians</button>
        <p class="nav-label">Operations</p>
        <button class="nav-item" data-view="inventory"><span class="nav-icon">▥</span>Parts inventory <b class="nav-alert">3</b></button>
        <button class="nav-item" data-view="billing"><span class="nav-icon">₱</span>Billing</button>
        <button class="nav-item" data-view="crm"><span class="nav-icon">♡</span>Customer CRM</button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">▥</span>Reports</button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-footer">
        <div class="profile"><span class="avatar avatar-orange" id="profileInitials">AM</span><div><b id="profileName">Alex Morgan</b><small id="profileRole">Administrator</small></div><span class="more">•••</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="menuToggle">☰</button>
        <div class="breadcrumbs"><span>Workspace</span><b>/</b><strong id="pageCrumb">Overview</strong></div>
        <div class="top-actions">
          <label class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Search anything..." aria-label="Search"></label>
          <button class="icon-button notification" aria-label="Notifications">♢<i></i></button>
          <button class="help">? <span>Help center</span></button>
          <button id="logoutButton" class="button button-ghost">Logout</button>
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header"><div><p class="eyebrow">Quick action</p><h2 id="modalTitle">New repair job</h2></div><button class="modal-close" id="modalClose">×</button></div>
      <form id="jobForm">
        <div class="form-grid">
          <label>Customer name<input id="jobCustomer" type="text" required placeholder="Enter customer name"></label>
          <label>Device name<input id="jobDevice" type="text" required placeholder="Enter device name"></label>
          <label class="wide">Problem / complaint<textarea required placeholder="Describe the customer's complaint..."></textarea></label>
          <label>Priority<select id="jobPriority"><option>Normal</option><option>High</option><option>Urgent</option></select></label>
          <label>Expected completion<input type="date" required></label>
        </div>
        <div class="modal-actions"><button type="button" class="button button-ghost" id="modalCancel">Cancel</button><button class="button button-primary">Create repair job</button></div>
      </form>
    </section>
  </div>

  <div class="modal-backdrop" id="customerModalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="customerModalTitle">
      <div class="modal-header"><div><p class="eyebrow">Customer management</p><h2 id="customerModalTitle">Add customer</h2></div><button class="modal-close" id="customerModalClose">×</button></div>
      <form id="customerForm">
        <div class="form-grid">
          <label>Full name<input id="customerName" required placeholder="Customer full name"></label>
          <label>Contact number<input id="customerContact" required placeholder="+1 (555) 000-0000"></label>
          <label>Email<input id="customerEmail" type="email" required placeholder="customer@email.com"></label>
          <label class="wide">Address<textarea id="customerAddress" placeholder="Customer address"></textarea></label>
        </div>
        <div class="modal-actions"><button type="button" class="button button-ghost" id="customerModalCancel">Cancel</button><button class="button button-primary">Add customer</button></div>
      </form>
    </section>
  </div>

  <div class="modal-backdrop" id="assignmentModalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="assignmentModalTitle">
      <div class="modal-header"><div><p class="eyebrow">Repair assignment</p><h2 id="assignmentModalTitle">Assign technician</h2></div><button class="modal-close" id="assignmentModalClose">×</button></div>
      <form id="assignmentForm">
        <label>Technician<select id="assignmentTechnician" required><option value="">Select a technician</option><option>Noah Williams</option><option>Sofia Patel</option><option>Liam Chen</option></select></label>
        <div class="modal-actions"><button type="button" class="button button-ghost" id="assignmentModalCancel">Cancel</button><button class="button button-primary">Save assignment</button></div>
      </form>
    </section>
  </div>

  <script src="js/app.js?v=crm-reference-4"></script>
</body>
</html>
